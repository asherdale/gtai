const cr = (p0, p1, p2, p3, f) => 0.5 * (2 * p1 + (p2 - p0) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (3 * p1 - p0 - 3 * p2 + p3) * f * f * f)

const me = (q) => [q[1], q[2]]
function playerAt(t) {

  return [cr(p0[0], p1[0], p2[0], p3[0], f), cr(p0[1], p1[1], p2[1], p3[1], f)]
}

let decisions = [], radioEvents = [], blocks = []
function derive() {
  decisions = R.events.filter((e) => e.kind === 'decision').map((d, i) => {
    const o = adj[d.node]?.[(d.exit || 'A').toUpperCase().charCodeAt(0) - 65]
    return { ...d, i, street: o ? G.edges[o.e].name || 'Side street' : '' }

    const ed = G.edges[e.e], p = ed.a === e.node ? ed.pts : [...ed.pts].reverse()
    return { ...e, h: Math.atan2(p[1][1] - p[0][1], p[1][0] - p[0][0]) }
  })
  radioEvents = [{ t: 0, tag: 'Dispatch', text: R.meta?.start ? `All units: suspect vehicle last seen at ${R.meta.start}` : 'All units: suspect vehicle at large' }]
  for (const e of R.events) {
    if (e.kind === 'tip') radioEvents.push({ t: e.t, tag: 'Dispatch', text: `911 caller reports the suspect at ${nodeName(e.node)}` })
    if (e.kind === 'stars') radioEvents.push({ t: e.t, tag: 'All units', text: e.stars === 5 ? 'Air unit is up. Lights on the suspect.' : `Suspect upgraded to ${'★'.repeat(e.stars)}` })
    if (e.kind === 'roadblock') radioEvents.push({ t: e.t, tag: 'Unit 7', text: `Roadblock set at ${nodeName(e.node)}` })
  }

}

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r) }
function car(x, y, h, len, body, roof, cop, flash) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(h)
  const w = len * 0.5
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(-len / 2 + 2, -w / 2 + 3, len, w, 4); ctx.fill()
  ctx.fillStyle = body; roundRect(-len / 2, -w / 2, len, w, 5); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1b1426'; ctx.stroke()
  ctx.fillStyle = '#9fd8ff'; roundRect(len * 0.12, -w / 2 + 2.5, len * 0.16, w - 5, 1.5); ctx.fill()
  ctx.fillStyle = roof; roundRect(-len * 0.26, -w / 2 + 2.5, len * 0.36, w - 5, 2); ctx.fill()
  if (cop) {

    ctx.shadowColor = ctx.fillStyle = flash ? '#ff2a4d' : '#5a1020'; ctx.fillRect(-len * 0.1, -w / 2 + 1.5, len * 0.12, w / 2 - 1.5)
    ctx.shadowColor = ctx.fillStyle = flash ? '#1b2a55' : '#2a6bff'; ctx.fillRect(-len * 0.1, 0, len * 0.12, w / 2 - 1.5)
    ctx.shadowBlur = 0

}

let shownRadio = 0, lastStars = 0, ph = null, bubbleFor = -1
const copH = []
function update(t, dt, snap, intro = 1) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#150e26'; ctx.fillRect(0, 0, W, H)
  const has = R.frames.length > 0, startNode = (R.meta ?? R.row) ? G.starts[(R.meta ?? R.row).start] : undefined, focus = has || G.nodes[startNode] !== undefined
  let px = cam.x, py = cam.y, fr = null
  if (!has && focus) { [px, py] = G.nodes[startNode]; cam.half = VIEW[0] }
  if (has) {
    fr = frameAt(t); [px, py] = playerAt(t)
    const th = lerp(fr.a[3], fr.a[3] + angDiff(fr.a[3], fr.b[3]), fr.f)
    ph = ph === null || snap ? th : ph + angDiff(ph, th) * Math.min(1, dt * 12)
    const need = VIEW[fr.a[4] - 1] ?? VIEW[0]
    cam.half = snap ? need : cam.half + (need - cam.half) * Math.min(1, dt * 1.2)
  }
  const chaseS = usable() / cam.half, cs = cityScale(), e = intro * intro * (3 - 2 * intro)
  cam.s = Math.exp(lerp(Math.log(cs), Math.log(chaseS), focus ? e : 0))
  cam.x = lerp((X0 + X1) / 2, px, focus ? e : 0); cam.y = lerp((Y0 + Y1) / 2, py, focus ? e : 0)
  const s = cam.s, P = (x, y) => [(x - cam.x) * s + W / 2, (y - cam.y) * s + H / 2]
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cam.x * s), DPR * (H / 2 - cam.y * s))
  ctx.imageSmoothingEnabled = true; ctx.drawImage(hill, HX, HY, HW * HC, HH * HC)
  const vx0 = cam.x - W / 2 / s - 40, vx1 = cam.x + W / 2 / s + 40, vy0 = cam.y - H / 2 / s - 40, vy1 = cam.y + H / 2 / s + 40, view = [vx0, vy0, vx1, vy1]
  drawAreas(ctx, areas, AREA, view)
  const bA = clamp01((s - 0.3) / 0.25)
  if (bA > 0) {
    const vb = bTiles.filter((tl) => tl.x1 >= vx0 && tl.x0 <= vx1 && tl.y1 >= vy0 && tl.y0 <= vy1)
    ctx.globalAlpha = bA; ctx.save(); ctx.translate(2.5 / s, 2.5 / s); ctx.fillStyle = '#0f0a1f'; for (const tl of vb) ctx.fill(tl.p); ctx.restore()
    ctx.fillStyle = '#352a5e'; for (const tl of vb) ctx.fill(tl.p); ctx.globalAlpha = 1
  }
  const vis = tileList.filter((tl) => tl.x1 >= vx0 && tl.x0 <= vx1 && tl.y1 >= vy0 && tl.y0 <= vy1).map(tilePaths)
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'
  for (const cls of ['alley', 'residential', 'main', 'freeway']) {
    const lw = Math.max(WIDTH[cls], MINPX[cls] / s)
    if (cls === 'main' || cls === 'freeway') { ctx.strokeStyle = 'rgba(181,155,255,0.16)'; ctx.lineWidth = lw * 2.6; for (const p of vis) ctx.stroke(p[cls]) }
    ctx.strokeStyle = ROAD[cls]; ctx.lineWidth = lw; for (const p of vis) ctx.stroke(p[cls])
  }
  fadeEdges(ctx, EDGE, view)
  ctx.drawImage(sea, M.x0, M.y0, M.w * M.cell, M.h * M.cell)
  strokeCoast(ctx, coast, 1 / s, true, EDGE)
  drawLabels(P, s, ...P(px, py))
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cam.x * s), DPR * (H / 2 - cam.y * s))
  if (!has) {
    const n = G.nodes[startNode]
    if (!n) { $('bubble').style.opacity = 0; bubbleRect = null; return }
    const o = adj[startNode][0], ed = G.edges[o.e], q = ed.a === startNode ? ed.pts : [...ed.pts].reverse(), [sx, sy] = P(n[0], n[1])
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    drawPlayer(sx, sy, Math.atan2(q[1][1] - q[0][1], q[1][0] - q[0][0]) + Math.PI)
    if (intro < 1) { $('bubble').style.opacity = 0; bubbleRect = null; return }
    if (bubbleFor !== -2) { bubbleFor = -2; $('pick').textContent = 'Planning the first move…'; $('line').textContent = '' }
    return placeBubble(sx, sy)
  }
  const { a, b, f } = fr, px1 = 1 / s

  if (a[7]) {
    const hx = lerp(a[7][0], (b[7] ?? a[7])[0], f), hy = lerp(a[7][1], (b[7] ?? a[7])[1], f), g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 150)
    g.addColorStop(0, 'rgba(255,243,176,0.42)'); g.addColorStop(0.75, 'rgba(255,243,176,0.22)'); g.addColorStop(1, 'rgba(255,243,176,0)')
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 150, 0, 7); ctx.fill()
  }
  const sight = 150
  const copsNow = a[6].map((_, i) => { const at = (q) => q[6][i], [ax, ay] = smooth(fr.lo, at), [bx, by] = smooth(fr.hi, at) ?? [ax, ay]; return [lerp(ax, bx, f), lerp(ay, by, f), Math.hypot(bx - ax, by - ay) > 0.3 ? Math.atan2(by - ay, bx - ax) : null] })
  for (const [cx, cy] of copsNow) { ctx.beginPath(); ctx.arc(cx, cy, sight, 0, 7); ctx.fillStyle = 'rgba(255,42,77,0.07)'; ctx.fill(); ctx.lineWidth = 1.5 * px1; ctx.strokeStyle = 'rgba(255,42,77,0.45)'; ctx.stroke() }

  ctx.lineWidth = 4 * px1; ctx.lineCap = 'round'
  const tStart = Math.max(0, t - 5)
  let prev = playerAt(tStart)
  for (let k = 1; k <= 25; k++) { const q = tStart + ((t - tStart) * k) / 25, cur = playerAt(q); ctx.strokeStyle = `rgba(51,230,255,${(k / 25) * 0.6})`; ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(cur[0], cur[1]); ctx.stroke(); prev = cur }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  const flashOn = Math.floor(t * 5) % 2 === 0, live = blocks.filter((e) => t >= e.t && t < e.t + 60)
  for (const e of live) {
    const [sx, sy] = P(G.nodes[e.node][0], G.nodes[e.node][1])
    ctx.save(); ctx.translate(sx + Math.cos(e.h) * 14 * K, sy + Math.sin(e.h) * 14 * K); ctx.rotate(e.h + Math.PI / 2); ctx.scale(K, K); ctx.shadowColor = '#ff2a4d'; ctx.shadowBlur = 14

    if (copH[i] === undefined || snap) copH[i] = dir ?? 0
    else if (dir !== null) copH[i] += angDiff(copH[i], dir) * Math.min(1, dt * 10)
    const rb = dir === null && live.find((e) => Math.hypot(G.nodes[e.node][0] - cx, G.nodes[e.node][1] - cy) < 45), [sx, sy] = P(cx, cy)
    if (rb) car(sx, sy, rb.h + Math.PI, 36 * K, '#f4efe6', '#1b1426', true, (i % 2 === 0) === flashOn)
    else car(sx, sy, copH[i], 36 * K, '#f4efe6', '#1b1426', true, (i % 2 === 0) === flashOn)
  })
  const [sx, sy] = P(px, py)
  drawPlayer(sx, sy, ph)
  if (a[7]) {
    const hx = lerp(a[7][0], (b[7] ?? a[7])[0], f), hy = lerp(a[7][1], (b[7] ?? a[7])[1], f), [hsx, hsy] = P(hx, hy)
    ctx.save(); ctx.translate(hsx, hsy); ctx.fillStyle = '#1b1426'; ctx.strokeStyle = '#f4efe6'; ctx.lineWidth = 2
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillRect(-24, -2, 14, 4)
    ctx.rotate(t * 14); ctx.strokeStyle = '#d8cdf0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.stroke(); ctx.restore()

  if (stars !== lastStars) { $('stars').innerHTML = `<span class="on">${'★'.repeat(stars)}</span><span class="off">${'★'.repeat(5 - stars)}</span>`; if (lastStars) { $('stars').classList.add('pulse'); setTimeout(() => $('stars').classList.remove('pulse'), 220) } lastStars = stars }
  $('time').textContent = fmt(R.result ? Math.min(t, R.result.time) : t)
  const k0 = Math.max(0, fr.lo - 2), k1 = Math.min(R.frames.length - 1, fr.hi + 2), q0 = smooth(k0, me), q1 = smooth(k1, me)
  const edge = nearestEdge(px, py), mph = Math.round((Math.hypot(q1[0] - q0[0], q1[1] - q0[1]) / Math.max(0.05, R.frames[k1][0] - R.frames[k0][0])) / 0.44704)
  const climb = edge ? ((G.nodes[edge.b][2] - G.nodes[edge.a][2]) / Math.max(1, edge.len)) * Math.sign(Math.cos(ph) * (G.nodes[edge.b][0] - G.nodes[edge.a][0]) + Math.sin(ph) * (G.nodes[edge.b][1] - G.nodes[edge.a][1])) : 0
  $('street').textContent = `${edge?.name || 'Side street'} · ${mph} mph${climb > 0.06 ? ' · steep hill' : ''}`
  while (shownRadio < radioEvents.length && radioEvents[shownRadio].t <= t) {
    const r = radioEvents[shownRadio++], div = document.createElement('div')
    div.innerHTML = `<span class="tag">${r.tag}</span>`; div.append(r.text); $('radio').prepend(div); while ($('radio').children.length > 3) $('radio').lastChild.remove()
  }
  const recent = decisions.findLast((d) => d.t <= t), bub = $('bubble')
  if (recent && t - recent.t < 3.6 && intro >= 1) {
    if (bubbleFor !== recent.i) {
      bubbleFor = recent.i
      $('pick').textContent = recent.speed === 'pull_over' ? 'Pull over' : `→ ${recent.street || 'Straight on'} · ${SPEED[recent.speed] ?? 'Floor it'}`
      $('line').textContent = recent.say && recent.say !== '…' ? `“${recent.say}”` : ''

  } else { bub.style.opacity = 0; bubbleRect = null }
}
function drawPlayer(sx, sy, h) {
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 46 * K)
  glow.addColorStop(0, 'rgba(51,230,255,0.4)'); glow.addColorStop(1, 'rgba(51,230,255,0)')
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, 46 * K, 0, 7); ctx.fill()
  car(sx, sy, h, 44 * K, '#33e6ff', '#e6fcff', false)
}
function placeBubble(sx, sy) {
  const bub = $('bubble'), bw = bub.offsetWidth, bh = bub.offsetHeight, tipX = sx + 8
  const left = Math.min(W - 10 - bw, Math.max(10, tipX - 23)), top = sy - 30 * K - 11 - bh
  bub.style.setProperty('--tail', `${Math.min(bw - 28, Math.max(10, tipX - left - 9))}px`)
  bub.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`
  bub.style.opacity = 1
  bubbleRect = [left, top, bw, bh]
}

function showMeta(row) {
  R.row = row
  $('info').textContent = `${row.name && row.name !== 'anonymous' ? '@' + row.name : 'anonymous'} · ${row.slug} · ${row.start}${row.attempt > 1 ? ` · run ${row.attempt}` : ''}`
  if (row.prompt) { const s = document.createElement('div'); s.className = 'strat'; s.textContent = `“${row.prompt}”`; $('info').append(s) }
}
function showFinal(end) {
  $('final').textContent = `Survived ${fmt(end)}`
  const prev = R.row?.previous_time
  if (prev != null) {
    const diff = end - prev
    $('delta').textContent = `${diff >= 0 ? '+' : '-'}${Math.abs(diff).toFixed(1)}s vs run ${R.row.attempt - 1}`
    $('delta').className = `d ${diff >= 0 ? 'up' : 'down'}`
  }
  $('busted').style.opacity = 1
  fetch(`/api/chases/${CHASE_ID}`).then((r) => r.json()).then((s) => {
    if (s.rank <= 100) $('rankline').textContent = s.rank === 1 ? '★ New #1 on the leaderboard! ★' : `★ #${s.rank} on the leaderboard! ★`
    if (s.beat_pct != null) $('standing').textContent = `Better than ${s.beat_pct}% of all chases`
  }).catch(() => {})
}
function showActions() {
  const box = $('actions'); box.innerHTML = ''; box.style.display = 'flex'; box.style.bottom = `${$('info').offsetHeight + 40}px`
  const row = R.row
  if (row?.mine && row.attempts_left > 0) {
    const b = document.createElement('button'); b.innerHTML = `Run it back (${row.attempts_left} left)<span class="sub">Your driver remembers how it got caught</span>`
    b.onclick = async () => { b.disabled = true; const r = await fetch(`/api/chases/${CHASE_ID}/again`, { method: 'POST' }); const j = await r.json(); if (j.id) location.href = `/chase?id=${j.id}`; else { b.textContent = j.error; } }
    box.append(b)
  }
  const text = `My AI agent survived ${fmt(R.result.time)} at ${'★'.repeat(R.result.stars)} in San Francisco. How long can yours last?`
  const share = document.createElement('a'); share.className = 'alt'; share.textContent = 'Share on X'; share.target = '_blank'
  share.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(location.origin + '/chase?id=' + CHASE_ID)}`
  const lb = document.createElement('a'); lb.className = 'alt'; lb.textContent = 'Home'; lb.href = '/'
  box.append(share, lb)
}

function showFailed() {
  if (phase === 'done' || phase === 'failed') return
  phase = 'failed'; $('count').textContent = ''; $('card').style.display = 'grid'
  $('status').textContent = 'This chase broke down before it got going. Sorry about that.'
  const box = $('retry'); box.innerHTML = ''; box.style.display = 'flex'
  if (R.row?.mine && R.row.attempt > 1) {
    const b = document.createElement('button'); b.textContent = 'Try again'
    b.onclick = async () => { b.disabled = true; const r = await fetch(`/api/chases/${CHASE_ID}/again`, { method: 'POST' }); const j = await r.json(); if (j.id) location.href = `/chase?id=${j.id}`; else b.textContent = j.error }
    box.append(b)
  }
  const home = document.createElement('a'); home.href = '/'; home.textContent = 'Start a new chase'; box.append(home)
}
let phase = 'waiting', rate = 1, t = SEEK ?? 0, last = performance.now(), countdownAt = 0
const es = new EventSource(`/api/chases/${CHASE_ID}/stream`)
es.addEventListener('meta', (ev) => { const row = JSON.parse(ev.data); showMeta(row); if (row.status === 'failed') showFailed() })
es.addEventListener('failed', () => showFailed())
es.addEventListener('queue', (ev) => {
  const { position, eta } = JSON.parse(ev.data)
  $('qpos').textContent = `You're #${position} in line`
  $('qeta').textContent = eta < 60 ? 'Your car is almost ready' : `About ${Math.round(eta / 60)} min until your car is ready`
  $('queue').style.display = 'grid'
})
es.addEventListener('init', (ev) => { $('queue').style.display = 'none'; const d = JSON.parse(ev.data); R.meta = d.meta; R.frames = d.frames; R.events = d.events; R.result = d.result; derive() })
es.addEventListener('update', (ev) => { const u = JSON.parse(ev.data); R.frames.push(...u.frames); R.events.push(...u.events); if (u.result) R.result = u.result; derive() })
es.addEventListener('end', () => es.close())
es.onerror = () => { if (R.result) es.close() }

await document.fonts.ready
if (SEEK !== null) {
  while (!R.result) await new Promise((r) => setTimeout(r, 200))
  $('card').style.display = 'none'
  const at = Math.min(SEEK, R.result.time)
  update(Math.max(0, at - 3), 0.016, true); for (let k = 0; k < 180; k++) update(Math.max(0, at - 3) + (k / 180) * Math.min(3, at), 1 / 60, false)
  update(at, 1 / 60, false)
  if (SEEK >= R.result.time) showFinal(R.result.time)
  const still = () => { update(at, 1 / 60, false); requestAnimationFrame(still) }
  requestAnimationFrame(still); document.body.dataset.ready = '1'
} else {
  const loop = (nowMs) => {
    requestAnimationFrame(loop)
    const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs
    try { step(nowMs, dt) } catch (err) { console.error(err) }
  }
  const step = (nowMs, dt) => {
    const lastT = R.frames.at(-1)?.[0] ?? 0
    if (phase === 'waiting') {
      update(0, dt, true, 0)
      if (R.meta) { phase = 'countdown'; countdownAt = nowMs; if (R.row) showMeta(R.row) }
    }
    if (phase === 'countdown') {
      const s = (nowMs - countdownAt) / 1000
      $('count').textContent = s < 0.8 ? '3' : s < 1.6 ? '2' : s < 2.4 ? '1' : ''
      update(0, dt, true, Math.min(1, s / 2.4))
      if (s >= 2.4) phase = 'playing'
    }
    if (phase === 'playing') {
      const end = R.result?.time ?? Infinity, ahead = lastT - t
      const target = R.result ? 1 : ahead < 0.2 ? 0 : Math.min(1, Math.max(0.55, ahead / 2))
      rate = target === 0 ? 0 : rate + (target - rate) * Math.min(1, dt * 2)
      t = Math.min(end, t + dt * rate)
      update(t, dt, false)
      if (t >= end) { phase = 'done'; showFinal(end); showActions() }
    }
    if (phase === 'done') update(t, dt, false)
  }
  requestAnimationFrame(loop)
}
